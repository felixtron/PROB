version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: prob-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: prob
      POSTGRES_PASSWORD: prob
      POSTGRES_DB: prob_db
    volumes:
      - prob-db:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  prob:
    build: .
    container_name: prob-app
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "3010:3010"
    environment:
      DATABASE_URL: postgresql://prob:prob@db:5432/prob_db?schema=public
      NEXT_PUBLIC_APP_URL: http://localhost:3010
    env_file:
      - .env
    volumes:
      - ./public/uploads:/app/public/uploads

    # Health check: ensures container restarts if app crashes
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3010/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Resource limits (adjust based on your infrastructure)
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=prob"

volumes:
  prob-db:
